<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Puzzle Press icon set. 24x24 viewBox, 1.5 stroke, square caps and joins,
     because every mark in this world is a printed rule, not a rounded UI glyph. -->
<symbol id="i-crop-mark" viewBox="0 0 24 24"><path d="M3 9V3h6M21 15v6h-6M21 9V3h-6M3 15v6h6"/></symbol>
<symbol id="i-registration" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 2v20M2 12h20"/></symbol>
<symbol id="i-reroll" viewBox="0 0 24 24"><path d="M20 7H8.5A4.5 4.5 0 0 0 4 11.5M4 17h11.5a4.5 4.5 0 0 0 4.5-4.5"/><path d="M17 4l3 3-3 3M7 14l-3 3 3 3"/></symbol>
<symbol id="i-drawer" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="6"/><rect x="3" y="13" width="18" height="6"/><path d="M10 8h4M10 16h4"/></symbol>
<symbol id="i-sheet" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
<symbol id="i-stack" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="14"/><path d="M7 4h13v13"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6"/></symbol>
<symbol id="i-slash" viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M4 4h4M16 20h4"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M16 4H4v12"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></symbol>
<symbol id="i-cancel" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></symbol>
</svg>
